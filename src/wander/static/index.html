<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Wander durable workboard">
  <title>Wander</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <header class="topbar">
    <div>
      <h1 class="brand-name">Wander</h1>
      <p class="brand-tagline">Not all who wander are lost.</p>
    </div>
    <div class="topbar-actions">
      <button id="jaunts-button" type="button" hidden>Jaunts</button>
      <label id="journey-select-label" for="journey-select">Journey</label>
      <select id="journey-select" aria-label="Select journey"></select>
      <button id="refresh-button" type="button">Refresh</button>
    </div>
  </header>

  <main id="dashboard" class="dashboard" aria-live="polite">
    <section class="empty-state">
      <p class="eyebrow">Wander</p>
      <h2>Not all who wander are lost.</h2>
      <p>Loading the workboard…</p>
    </section>
  </main>

  <dialog id="jaunts-dialog" class="jaunts-dialog" aria-labelledby="jaunts-title">
    <div class="jaunts-shell">
      <header class="jaunts-header">
        <div>
          <p class="eyebrow">Quick work</p>
          <h2 id="jaunts-title">Jaunts</h2>
          <p>Loose tasks and working notes. Promote only when structure becomes useful.</p>
        </div>
        <button id="jaunts-close" class="quiet-button" type="button" aria-label="Close Jaunts">Close</button>
      </header>

      <div class="jaunts-layout">
        <aside class="jaunts-sidebar">
          <div class="jaunts-list-actions">
            <button id="jaunt-new" type="button">New Jaunt</button>
            <button id="jaunts-refresh" class="quiet-button" type="button">Refresh</button>
          </div>
          <label class="completed-toggle">
            <input id="jaunts-show-completed" type="checkbox">
            Show completed
          </label>
          <div id="jaunts-list" class="jaunts-list" role="list"></div>
        </aside>

        <section class="jaunt-editor" aria-live="polite">
          <form id="jaunt-form">
            <div class="jaunt-editor-heading">
              <span id="jaunt-status" class="status-chip">New</span>
              <span id="jaunt-updated" class="jaunt-updated"></span>
            </div>
            <label for="jaunt-title">Title</label>
            <input id="jaunt-title" name="title" type="text" maxlength="240" required>
            <label for="jaunt-notes">Notes</label>
            <textarea id="jaunt-notes" name="notes" rows="15" placeholder="Drop links, observations, reminders, and rough notes here."></textarea>
            <p id="jaunt-message" class="jaunt-message" role="status"></p>
            <div class="jaunt-form-actions">
              <button id="jaunt-save" type="submit">Create Jaunt</button>
              <button id="jaunt-complete" class="quiet-button" type="button" hidden>Complete</button>
              <button id="jaunt-reopen" class="quiet-button" type="button" hidden>Reopen</button>
            </div>
          </form>

          <section id="jaunt-history-section" class="jaunt-history-section" hidden>
            <h3>History</h3>
            <div id="jaunt-history" class="jaunt-history"></div>
          </section>
        </section>
      </div>
    </div>
  </dialog>

  <template id="journey-template">
    <section class="hero panel">
      <div>
        <div class="status-line">
          <span class="pulse" aria-hidden="true"></span>
          <span data-field="status"></span>
          <span class="version" data-field="version"></span>
        </div>
        <p class="journey-title">
          <span>Journey:</span>
          <strong data-field="title"></strong>
          <a class="share-link" data-action="share" href="#">Share</a>
        </p>
        <p class="objective">
          <span>Journey Description:</span>
          <span data-field="objective"></span>
        </p>
        <div class="journey-links" data-section="journey-links" hidden>
          <span>Links:</span>
          <div class="link-list" data-list="journey-links"></div>
        </div>
      </div>
    </section>

    <section class="main-grid">
      <div class="panel work-panel">
        <div class="section-heading">
          <div>
            <p class="eyebrow">Execution</p>
            <h3>Work items</h3>
          </div>
          <span class="progress-label" data-field="progress"></span>
        </div>
        <div class="progress-track"><span data-field="progress-bar"></span></div>
        <ol class="work-list" data-list="work-items"></ol>
      </div>
    </section>

    <section class="panel activity-panel">
      <div class="section-heading">
        <div>
          <p class="eyebrow">Provenance</p>
          <h3>Recent activity</h3>
        </div>
        <span data-field="updated"></span>
      </div>
      <div class="event-list" data-list="events"></div>
    </section>
  </template>

  <script src="/app.js" defer></script>
</body>
</html>
